name: SF2 Autonomous Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sf2-autonomous-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ensure autonomous chain is alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          runs="$(gh run list --repo "$repo" --limit 100 --json databaseId,name,status,conclusion,workflowName,createdAt,updatedAt)"

          guardian_active="$(printf '%s' "$runs" | jq '[.[] | select(.workflowName=="SF2 Oracle Guardian" and (.status=="in_progress" or .status=="queued"))] | length')"
          analyst_active="$(printf '%s' "$runs" | jq '[.[] | select(.workflowName=="SF2 Divergence Analyst" and (.status=="in_progress" or .status=="queued"))] | length')"
          resolver_active="$(printf '%s' "$runs" | jq '[.[] | select(.workflowName=="SF2 Issue Resolver" and (.status=="in_progress" or .status=="queued"))] | length')"

          chain_active=$((guardian_active + analyst_active + resolver_active))
          if [ "$chain_active" -eq 0 ]; then
            echo "No productive agent is active; starting one Guardian iteration."
            gh workflow run oracle-guardian.yml --repo "$repo" --ref main
          else
            echo "Productive chain active: guardian=$guardian_active analyst=$analyst_active resolver=$resolver_active"
          fi

          echo "Watchdog completed; it restarts only a genuinely idle chain."
