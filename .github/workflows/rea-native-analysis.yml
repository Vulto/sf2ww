name: REA Native SF2 Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install build toolchain and JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build native port
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev unzip curl
          make clean
          make -j2
          test -x ./glutBasics

      - name: Install Ghidra
        env:
          GhidraUrl: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          GhidraSha256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra"
          curl -fsSL "$GhidraUrl" -o "$RUNNER_TEMP/ghidra.zip"
          printf '%s  %s\n' "$GhidraSha256" "$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"

      - name: Run REA native analysis
        run: |
          set -euo pipefail
          mkdir -p .agent/rea
          npx -y rea-agents@4.1.0 providers --json | tee .agent/rea/providers.json
          npx -y rea-agents@4.1.0 analyze ./glutBasics --provider ghidra --json > .agent/rea/glutBasics-analysis.json

      - name: Upload REA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-native-analysis-${{ github.run_id }}
          path: .agent/rea
          if-no-files-found: error
          retention-days: 14
