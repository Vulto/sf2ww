name: SF2 Divergence Analyst
on:
  workflow_dispatch:
    inputs:
      oracle_run_id: {required: true, type: string}
concurrency:
  group: sf2-divergence-analyst
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Download oracle evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .agent/oracle
          gh run download "${{ inputs.oracle_run_id }}" --repo "$GITHUB_REPOSITORY" -n sf2-oracle-evidence -D .agent/oracle
      - name: Divergence Analyst agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: "Vulto"
          effort: high
          prompt: |
            You are Agent 2, Divergence Analyst. Analyze only empirical oracle evidence.
            Read .agent/oracle/oracle_diagnostic.md first and then paired traces.
            For every independent divergence find the earliest causal mismatch, not the visual symptom.
            Correlate state, cycles/time, PC/registers, RAM/memory evidence, RNG, video and audio.
            Verify interpretations against MAME/JTCPS. Do not modify implementation or acceptance criteria.
            Create one detailed .agent/issues/issue-*.md per root cause or instrumentation gap.
            Include exact scenario, transition/frame/scanline/cycle, expected/observed/delta,
            preceding matching checkpoint, causal evidence, addresses/PC when known, references,
            falsifiable hypothesis, reproduction, required regression and uncertainty.
      - name: Queue diagnosed and outstanding issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .agent/issues

          # Publish this run's newly diagnosed root causes.
          while IFS= read -r f; do
            test -s "$f"
            title=$(sed -n 's/^# Title: *//p' "$f" | head -1)
            test -n "$title"
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$f")
            issue_number=$(basename "$issue_url")
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body '<!-- sf2-agent-queued -->'
            gh workflow run sf2-issue-resolver.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number"
          done < <(find .agent/issues -type f -name 'issue-*.md' | sort)

          # A failed pipeline must not strand previously discovered work.
          resolver_active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sf2-issue-resolver.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "$resolver_active" -eq 0 ]; then
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,comments \
              --jq '.[] | select(.comments | map(.body // "") | any(. == "<!-- sf2-agent-queued -->") | not) | .number' |
            while IFS= read -r issue_number; do
              test -n "$issue_number"
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body '<!-- sf2-agent-queued -->'
              gh workflow run sf2-issue-resolver.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$issue_number"
              break
            done
          fi
