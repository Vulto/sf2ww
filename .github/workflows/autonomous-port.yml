name: Autonomous SF2 Port Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: sf2-autonomous-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  DEBIAN_FRONTEND: noninteractive
  JTCPS_REPO: https://github.com/jotego/jtcps.git
  MAME_REPO: https://github.com/mamedev/mame.git

jobs:
  agent:
    name: Autonomous diagnose-fix-validate loop
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install toolchain and reference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev xvfb mame mame-tools git unzip curl jq
          gcc --version
          make --version
          mame -version
          mame -listxml sf2ua >/dev/null

      - name: Materialize reference sources
        run: |
          set -euo pipefail
          rm -rf .agent/reference
          mkdir -p .agent/reference
          git clone --depth 1 --filter=blob:none --sparse "$JTCPS_REPO" .agent/reference/jtcps
          git -C .agent/reference/jtcps sparse-checkout set cores/cps1 cores/cps15 doc
          git clone --depth 1 --filter=blob:none --sparse "$MAME_REPO" .agent/reference/mame
          git -C .agent/reference/mame sparse-checkout set docs src/mame/capcom src/devices/cpu/m68000
          git -C .agent/reference/jtcps rev-parse HEAD | tee .agent/reference/JTCPS_COMMIT
          git -C .agent/reference/mame rev-parse HEAD | tee .agent/reference/MAME_COMMIT

      - name: Checkout private ROM fixture
        uses: actions/checkout@v4
        with:
          repository: Vulto/sf2wwrom
          ref: main
          path: .agent/private-rom
          token: ${{ github.token }}
          sparse-checkout: |
            sf2ua.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Materialize private MAME fixture
        run: |
          set -euo pipefail
          export SF2_ROM_ROOT="$RUNNER_TEMP/sf2-rom"
          echo "SF2_ROM_ROOT=$SF2_ROM_ROOT" >> "$GITHUB_ENV"
          rm -rf "$SF2_ROM_ROOT"
          mkdir -p "$SF2_ROM_ROOT/roms"
          test -s .agent/private-rom/sf2ua.zip
          cp .agent/private-rom/sf2ua.zip "$SF2_ROM_ROOT/rom.zip"
          printf '%s  %s\n' \
            "385d7a21b8e983e6aabccaf0f6a12d55fd991f08defc7bbd837f592c48eee156" \
            "$SF2_ROM_ROOT/rom.zip" | sha256sum -c -
          unzip -q -o "$SF2_ROM_ROOT/rom.zip" -d "$SF2_ROM_ROOT/roms"
          mkdir -p "$SF2_ROM_ROOT/roms/sf2ua"
          find "$SF2_ROM_ROOT/roms" -type f ! -path "$SF2_ROM_ROOT/roms/sf2ua/*" -exec cp {} "$SF2_ROM_ROOT/roms/sf2ua/" \;
          rm -f allroms.bin sf2gfx.bin
          ./bin/prepare-rom.sh "$SF2_ROM_ROOT/rom.zip"
          cp allroms.bin "$SF2_ROM_ROOT/allroms.bin"
          cp sf2gfx.bin "$SF2_ROM_ROOT/sf2gfx.bin"
          rm -f allroms.bin sf2gfx.bin "$SF2_ROM_ROOT/rom.zip"
          test -s "$SF2_ROM_ROOT/allroms.bin"
          test -s "$SF2_ROM_ROOT/sf2gfx.bin"
          test -d "$SF2_ROM_ROOT/roms/sf2ua"
          test -n "$(find "$SF2_ROM_ROOT/roms/sf2ua" -type f -print -quit)"
          mame -rompath "$SF2_ROM_ROOT/roms" -verifyroms sf2ua

      - name: Gate autonomous agent on immutable real ROM fixture
        run: |
          set -euo pipefail
          test -s "$SF2_ROM_ROOT/allroms.bin"
          test -s "$SF2_ROM_ROOT/sf2gfx.bin"
          test -n "$(find "$SF2_ROM_ROOT/roms" -type f -print -quit)"
          mame -listxml sf2ua >/dev/null
          {
            echo "ROM fixture manifest"
            stat -c 'allroms.bin bytes=%s' "$SF2_ROM_ROOT/allroms.bin"
            sha256sum "$SF2_ROM_ROOT/allroms.bin"
            stat -c 'sf2gfx.bin bytes=%s' "$SF2_ROM_ROOT/sf2gfx.bin"
            sha256sum "$SF2_ROM_ROOT/sf2gfx.bin"
            find "$SF2_ROM_ROOT/roms" -type f -print0 | sort -z | xargs -0 sha256sum
          } | tee "$RUNNER_TEMP/sf2-rom-fixture-manifest.txt"
          chmod -R a-w "$SF2_ROM_ROOT"
          cp .agent/private-rom/sf2ua.zip "$RUNNER_TEMP/sf2-rom-source.zip"
          chmod a-w "$RUNNER_TEMP/sf2-rom-source.zip"

      - name: Baseline compile diagnostics
        id: baseline
        continue-on-error: true
        run: |
          set -o pipefail
          make clean
          make -j2 2>&1 | tee "$RUNNER_TEMP/sf2-build.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Summarize compiler diagnostics
        if: always()
        run: |
          {
            echo "# Baseline compiler diagnostics"
            echo
            if [ -f "$RUNNER_TEMP/sf2-build.log" ]; then
              grep -E 'error:|warning:|cc1: all warnings' "$RUNNER_TEMP/sf2-build.log" || true
            else
              echo "No build log was produced."
            fi
          } > "$RUNNER_TEMP/sf2-compile-summary.md"

      - name: Freeze oracle guard
        run: |
          set -euo pipefail
          sha256sum scripts/validate_test_oracle_integrity.sh > "$RUNNER_TEMP/oracle-guard.sha256"

      - name: Run Codex agent
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: "Vulto"
          effort: high
          prompt: |
            You are the autonomous engineering agent for Vulto/sf2ww.

            Mission: continue on main until the fixed arcade target is behaviorally reproduced by the native C/OpenGL port. Do not stop at a green build.

            Read first:
              AGENTS.md
              docs/agent/BACKLOG.md
              docs/agent/FINDINGS.md
              docs/agent/STATE_MAP.md
              docs/agent/ARCHITECTURE_EXCEPTIONS.md
              docs/agent/RENDER_VALIDATION.md
              docs/agent/TIMING_VALIDATION.md

            References:
              .agent/reference/jtcps
              .agent/reference/mame
            $SF2_ROM_ROOT is an immutable private ROM fixture outside the workspace. Never delete, rewrite, truncate or generate substitute ROM files there.

            Mandatory methodology:
              - The only build system is Make. Do not reintroduce CMake or cmocka.
              - Keep C99, OpenGL and -Wall -Wextra -Werror.
              - Do not use frame-number equality as the primary behavioral oracle.
              - Compare numeric state transitions and arcade_time_ns/arcade_cpu_cycles.
              - MAME machine.time converted with attotime:as_ticks(10000000) is the common arcade-time axis.
              - Capture MAME 68000 PC/registers for causal diagnosis.
              - Native host_logic_ns and host_start_late_ns are performance/deadline measurements, not x86-equivalence claims.
              - Use MAME source/docs and JTCPS/JTFRAME as independent evidence. Do not guess constants.
              - Every fix requires an observed divergence, a falsifiable hypothesis and a regression.
              - Preserve integer/fixed-point semantics.
              - The real ROM fixture gate has already passed before you start. The fixture is outside the workspace at $SF2_ROM_ROOT and must never be replaced or regenerated. If it becomes unavailable, stop behavioral work and report the validation failure.
              - Never create branches, force-push, weaken tests, or hide divergences.
              - Do not commit or push; the wrapper validates and commits.

            Autonomous iteration protocol:
              1. Read all persistent state and previous findings before changing code.
              2. Run BOTH sides from clean state: the immutable private sf2ua MAME fixture and the current native port.
              3. Collect the largest useful observation set available without weakening determinism:
                 logical state, transitions, arcade time, CPU cycles, PC/register context, memory accesses, RAM changes, framebuffer and audio events.
              4. Cover the entire attract cycle before accepting a partial attract result: disclaimer/boot, Capcom/SF2 logo, title/opening, demo fight, transitions and rank/high-score display.
              5. Compare the two runs and locate the FIRST causal divergence, not merely the first visible symptom.
              6. Preserve a bounded evidence window around the divergence and record the exact field/address/PC/cycle/input responsible when available.
              7. Form one falsifiable hypothesis and verify it against MAME source, JTCPS/hardware documentation or a controlled experiment.
              8. Implement the smallest root-cause correction in the native port. Never compensate timestamps or mask a mismatch.
              9. Add or strengthen a regression that demonstrates the old behavior fails and the corrected behavior passes.
              10. Never weaken an existing oracle. Do not remove assertions, increase tolerances, shorten observation windows, ignore errors, or replace real MAME evidence with synthetic fixtures.
              11. Treat audio as a first-class target. The current port has unimplemented sound paths; trace MAME audio-command writes/CPU behavior and implement the native equivalent, then compare event sequence and timing.
              12. Run build, -Werror, sanitizer, smoke, semantic, visual, audio and real-MAME gates.
              13. If a test fails, investigate and fix the port or improve the observation method with an independently failing regression. Never modify a test merely to obtain PASS.
              14. Record evidence, root cause, changed files, regressions and remaining uncertainty in docs/agent/FINDINGS.md and update BACKLOG.md.
              15. Audit the method itself after each iteration: identify blind spots and add instrumentation/tests when they prevent causal diagnosis.
              16. Continue until the iteration produces validated progress; then let the wrapper commit and dispatch the next iteration automatically.
              17. If blocked, change the investigation strategy and continue. Stop only for an external permission/fixture problem that the repository and runner cannot solve.

            Sound-specific mandate:
              - Inspect FistBlue/sound.c before any gameplay correction that emits sound.
              - Replace the current no-op sound queue paths with a native audio backend only after observing the MAME command/event protocol.
              - Preserve command ordering, duplicates, stage music selection, sound effects, and attract/demo gating.
              - Add deterministic audio-event traces on both sides before using waveform output as the primary oracle.

      - name: Capture agent changes
        id: changes
        run: |
          set -euo pipefail
          set +e
          git diff --check
          diff_status=$?
          set -e
          if [ "$diff_status" -ne 0 ]; then
            echo "::error::git diff --check failed; refusing to classify workspace changes."
            git diff --check || true
            exit "$diff_status"
          fi
          rm -f mame_state.csv mame_exec_numeric.csv port_state.csv port_timing.csv
          rm -f mame_exec_input.csv port_state_input.csv port_timing_input.csv
          rm -f mame_exec_attract.csv port_state_attract.csv port_timing_attract.csv
          rm -f visual_comparison.csv visual_modes.csv native_visual_objects.txt
          rm -rf mame_visual native_visual
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git status --short

      - name: Protect test oracles
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/oracle-guard.sha256"
          sha256sum -c "$RUNNER_TEMP/oracle-guard.sha256"
          bash scripts/validate_test_oracle_integrity.sh

      - name: Build and validate changed tree
        run: |
          set -euo pipefail
          make clean
          make -j2
          make clean
          make SANITIZE=1 -j2
          make clean
          make -j2
          make semantic-test
          bash scripts/validate_golden_traces.sh

      - name: Re-materialize immutable lockstep fixture after agent
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/sf2-rom-source.zip"
          rm -rf "$RUNNER_TEMP/sf2-lockstep-rom"
          mkdir -p "$RUNNER_TEMP/sf2-lockstep-rom/roms"
          cp "$RUNNER_TEMP/sf2-rom-source.zip" "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip"
          printf '%s  %s\n' \
            "385d7a21b8e983e6aabccaf0f6a12d55fd991f08defc7bbd837f592c48eee156" \
            "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip" -d "$RUNNER_TEMP/sf2-lockstep-rom/roms"
          mkdir -p "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua"
          find "$RUNNER_TEMP/sf2-lockstep-rom/roms" -type f ! -path "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua/*" -exec cp {} "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua/" \;
          rm -f allroms.bin sf2gfx.bin
          ./bin/prepare-rom.sh "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip"
          cp allroms.bin "$RUNNER_TEMP/sf2-lockstep-rom/allroms.bin"
          cp sf2gfx.bin "$RUNNER_TEMP/sf2-lockstep-rom/sf2gfx.bin"
          rm -f allroms.bin sf2gfx.bin "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip"
          test -s "$RUNNER_TEMP/sf2-lockstep-rom/allroms.bin"
          test -s "$RUNNER_TEMP/sf2-lockstep-rom/sf2gfx.bin"
          test -d "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua"
          test -n "$(find "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua" -type f -print -quit)"
          mame -rompath "$RUNNER_TEMP/sf2-lockstep-rom/roms" -verifyroms sf2ua
          chmod -R a-w "$RUNNER_TEMP/sf2-lockstep-rom"
          {
            echo "FINAL LOCKSTEP ROM FIXTURE"
            sha256sum "$RUNNER_TEMP/sf2-lockstep-rom/allroms.bin"
            sha256sum "$RUNNER_TEMP/sf2-lockstep-rom/sf2gfx.bin"
            find "$RUNNER_TEMP/sf2-lockstep-rom/roms" -type f -print0 | sort -z | xargs -0 sha256sum
          } | tee "$RUNNER_TEMP/sf2-lockstep-rom-fixture-manifest.txt"

      - name: Real MAME lockstep gate
        uses: ./.github/actions/mame-lockstep
        with:
          rom-root: ${{ runner.temp }}/sf2-lockstep-rom
          port-executable: ./glutBasics
          mame-bin: mame
          mame-set: sf2ua
          deep-trace: ${{ github.event_name == 'schedule' }}

      - name: Record validation evidence
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sf2-agent"
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "jtcps=$(cat .agent/reference/JTCPS_COMMIT)"
            echo "mame=$(cat .agent/reference/MAME_COMMIT)"
            echo "real_rom_lockstep=required-and-executed"
          } > "$RUNNER_TEMP/sf2-agent/last-validation.txt"

      - name: Commit validated progress
        id: commit
        run: |
          set -euo pipefail
          git config user.name "sf2-autonomous-agent"
          git config user.email "sf2-autonomous-agent@users.noreply.github.com"

          # The real MAME lockstep step above is mandatory and fail-closed.
          # If it is missing, skipped, or fails, this job cannot reach the commit step.

          # Dependency files are generated build artifacts and must never enter main.
          find . -type f -name "*.d" -delete
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "agent: advance native SF2 port"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Continue autonomous iteration
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-port.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sf2-agent-diagnostics-${{ github.run_id }}
          path: |
            agent_smoke.csv
            agent_timing.csv
            mame_state.csv
            port_state.csv
            ${{ runner.temp }}/sf2-agent/last-validation.txt
            ${{ runner.temp }}/sf2-rom-fixture-manifest.txt
            ${{ runner.temp }}/sf2-lockstep-rom-fixture-manifest.txt
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
