name: Autonomous SF2 Port Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: sf2-autonomous-main
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  DEBIAN_FRONTEND: noninteractive
  JTCPS_REPO: https://github.com/jotego/jtcps.git
  MAME_REPO: https://github.com/mamedev/mame.git

jobs:
  agent:
    name: Autonomous diagnose-fix-validate loop
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install toolchain and reference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev xvfb mame mame-tools git unzip curl jq
          gcc --version
          make --version
          mame -version
          mame -listxml sf2ua >/dev/null

      - name: Materialize reference sources
        run: |
          set -euo pipefail
          rm -rf .agent/reference
          mkdir -p .agent/reference
          git clone --depth 1 --filter=blob:none --sparse "$JTCPS_REPO" .agent/reference/jtcps
          git -C .agent/reference/jtcps sparse-checkout set cores/cps1 cores/cps15 doc
          git clone --depth 1 --filter=blob:none --sparse "$MAME_REPO" .agent/reference/mame
          git -C .agent/reference/mame sparse-checkout set docs src/mame/capcom src/devices/cpu/m68000
          git -C .agent/reference/jtcps rev-parse HEAD | tee .agent/reference/JTCPS_COMMIT
          git -C .agent/reference/mame rev-parse HEAD | tee .agent/reference/MAME_COMMIT

      - name: Checkout private ROM fixture
        uses: actions/checkout@v4
        with:
          repository: Vulto/sf2wwrom
          ref: main
          path: .agent/private-rom
          token: ${{ github.token }}
          sparse-checkout: |
            sf2ua.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Materialize private MAME fixture
        run: |
          set -euo pipefail
          rm -rf .agent/rom
          mkdir -p .agent/rom/roms
          test -s .agent/private-rom/sf2ua.zip
          cp .agent/private-rom/sf2ua.zip .agent/rom/rom.zip
          printf '%s  %s\n' \
            "385d7a21b8e983e6aabccaf0f6a12d55fd991f08defc7bbd837f592c48eee156" \
            ".agent/rom/rom.zip" | sha256sum -c -
          unzip -q -o .agent/rom/rom.zip -d .agent/rom/roms
          rm -f allroms.bin sf2gfx.bin
          ./bin/prepare-rom.sh .agent/rom/rom.zip
          cp allroms.bin .agent/rom/allroms.bin
          cp sf2gfx.bin .agent/rom/sf2gfx.bin
          rm -f allroms.bin sf2gfx.bin .agent/rom/rom.zip
          test -s .agent/rom/allroms.bin
          test -s .agent/rom/sf2gfx.bin
          test -n "$(find .agent/rom/roms -type f -print -quit)"
          mame -listxml sf2ua >/dev/null

      - name: Baseline compile diagnostics
        id: baseline
        continue-on-error: true
        run: |
          set -o pipefail
          make clean
          make -j2 2>&1 | tee "$RUNNER_TEMP/sf2-build.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Summarize compiler diagnostics
        if: always()
        run: |
          {
            echo "# Baseline compiler diagnostics"
            echo
            if [ -f "$RUNNER_TEMP/sf2-build.log" ]; then
              grep -E 'error:|warning:|cc1: all warnings' "$RUNNER_TEMP/sf2-build.log" || true
            else
              echo "No build log was produced."
            fi
          } > "$RUNNER_TEMP/sf2-compile-summary.md"

      - name: Gate autonomous agent on real ROM fixture
        run: |
          set -euo pipefail
          test -s .agent/rom/allroms.bin
          test -s .agent/rom/sf2gfx.bin
          test -n "$(find .agent/rom/roms -type f -print -quit)"
          mame -listxml sf2ua >/dev/null

      - name: Run Codex agent
        uses: openai/codex-action@v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: "Vulto"
          effort: high
          prompt: |
            You are the autonomous engineering agent for Vulto/sf2ww.

            Mission: continue on main until the fixed arcade target is behaviorally reproduced by the native C/OpenGL port. Do not stop at a green build.

            Read first:
              AGENTS.md
              docs/agent/BACKLOG.md
              docs/agent/FINDINGS.md
              docs/agent/STATE_MAP.md
              docs/agent/ARCHITECTURE_EXCEPTIONS.md
              docs/agent/RENDER_VALIDATION.md
              docs/agent/TIMING_VALIDATION.md

            References:
              .agent/reference/jtcps
              .agent/reference/mame
            If .agent/rom exists, it contains the private ROM fixture.

            Mandatory methodology:
              - The only build system is Make. Do not reintroduce CMake or cmocka.
              - Keep C99, OpenGL and -Wall -Wextra -Werror.
              - Do not use frame-number equality as the primary behavioral oracle.
              - Compare numeric state transitions and arcade_time_ns/arcade_cpu_cycles.
              - MAME machine.time converted with attotime:as_ticks(10000000) is the common arcade-time axis.
              - Capture MAME 68000 PC/registers for causal diagnosis.
              - Native host_logic_ns and host_start_late_ns are performance/deadline measurements, not x86-equivalence claims.
              - Use MAME source/docs and JTCPS/JTFRAME as independent evidence. Do not guess constants.
              - Every fix requires an observed divergence, a falsifiable hypothesis and a regression.
              - Preserve integer/fixed-point semantics.
              - If real ROM lockstep is unavailable, STOP behavioral work. Do not modify gameplay/graphics logic, do not commit code changes, and do not describe validation as successful.
              - Never create branches, force-push, weaken tests, or hide divergences.
              - Do not commit or push; the wrapper validates and commits.

            Loop continuously:
              1. inspect diagnostics and current comparison;
              2. find the first causal numeric divergence;
              3. verify it against MAME/JTCPS evidence;
              4. make the smallest root-cause correction;
              5. add a regression;
              6. run make, sanitizer, smoke and real-MAME comparison when available;
              7. record evidence and repeat.

      - name: Capture agent changes
        id: changes
        run: |
          set -euo pipefail
          git diff --check
          rm -f mame_state.csv mame_exec_numeric.csv port_state.csv port_timing.csv
          rm -f mame_exec_input.csv port_state_input.csv port_timing_input.csv
          rm -f mame_exec_attract.csv port_state_attract.csv port_timing_attract.csv
          rm -f visual_comparison.csv visual_modes.csv native_visual_objects.txt
          rm -rf mame_visual native_visual
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git status --short

      - name: Build and validate changed tree
        run: |
          set -euo pipefail
          make clean
          make -j2
          make clean
          make SANITIZE=1 -j2
          make clean
          make -j2
          truncate -s 1048576 allroms.bin
          truncate -s 6291456 sf2gfx.bin
          set +e
          SF2_STATE_LOG=agent_smoke.csv SF2_TIMING_LOG=agent_timing.csv timeout 15s xvfb-run -a ./glutBasics </dev/null
          status=$?
          set -e
          test "$status" -eq 124
          test -s agent_smoke.csv
          test -s agent_timing.csv
          awk -F, 'NR > 1 { n++ } END { if (n < 300) exit 1 }' agent_smoke.csv
          rm -f allroms.bin sf2gfx.bin agent_smoke.csv agent_timing.csv
          bash scripts/validate_golden_traces.sh

      - name: Real MAME lockstep gate
        uses: ./.github/actions/mame-lockstep
        with:
          rom-root: .agent/rom
          port-executable: ./glutBasics
          mame-bin: mame
          mame-set: sf2ua

      - name: Record validation evidence
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sf2-agent"
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "jtcps=$(cat .agent/reference/JTCPS_COMMIT)"
            echo "mame=$(cat .agent/reference/MAME_COMMIT)"
            echo "real_rom_lockstep=required-and-executed"
          } > "$RUNNER_TEMP/sf2-agent/last-validation.txt"

      - name: Commit validated progress
        id: commit
        run: |
          set -euo pipefail
          git config user.name "sf2-autonomous-agent"
          git config user.email "sf2-autonomous-agent@users.noreply.github.com"

          # The real MAME lockstep step above is mandatory and fail-closed.
          # If it is missing, skipped, or fails, this job cannot reach the commit step.

          # Dependency files are generated build artifacts and must never enter main.
          find . -type f -name "*.d" -delete
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "agent: advance native SF2 port"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Continue immediately after progress
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autonomous-port.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sf2-agent-diagnostics-${{ github.run_id }}
          path: |
            agent_smoke.csv
            agent_timing.csv
            mame_state.csv
            port_state.csv
            ${{ runner.temp }}/sf2-agent/last-validation.txt
          if-no-files-found: ignore
          retention-days: 7
