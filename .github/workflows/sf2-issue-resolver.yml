name: SF2 Issue Resolver
on:
  workflow_dispatch:
    inputs:
      issue_number: {required: true, type: string}
concurrency:
  group: sf2-issue-resolver-main
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Read issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "${{ inputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --comments > .agent_issue.md
      - name: Resolution agent
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: "Vulto"
          effort: high
          prompt: |
            You are Agent 3, Issue Resolver. Solve only the assigned evidence-backed issue.
            Reproduce it first. Identify root cause, implement the smallest native correction,
            add a deterministic regression, and validate against the real MAME oracle.
            Never compensate timestamps, weaken assertions/tolerances, shorten observation windows,
            replace ROM evidence, or change tests merely to obtain PASS.
            Document root cause and evidence. Do not create branches. The wrapper validates and commits.
      - name: Checkout original private ROM for resolver validation
        uses: actions/checkout@v4
        with:
          repository: Vulto/sf2wwrom
          ref: main
          token: ${{ secrets.SF2WWROM_TOKEN || secrets.SF2_ROM_REPO_TOKEN }}
          path: .agent/private-rom
          sparse-checkout: |
            sf2ua.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Verify and materialize original ROM for resolver validation
        run: |
          set -euo pipefail
          test -s .agent/private-rom/sf2ua.zip
          printf '%s  %s\n' "385d7a21b8e983e6aabccaf0f6a12d55fd991f08defc7bbd837f592c48eee156" .agent/private-rom/sf2ua.zip | sha256sum -c -
          chmod -R a-w .agent/private-rom
          mkdir -p "$RUNNER_TEMP/sf2-lockstep-rom/roms"
          cp .agent/private-rom/sf2ua.zip "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip"
          printf '%s  %s\n' "385d7a21b8e983e6aabccaf0f6a12d55fd991f08defc7bbd837f592c48eee156" "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip" -d "$RUNNER_TEMP/sf2-lockstep-rom/roms"
          mkdir -p "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua"
          find "$RUNNER_TEMP/sf2-lockstep-rom/roms" -type f ! -path "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua/*" -exec cp {} "$RUNNER_TEMP/sf2-lockstep-rom/roms/sf2ua/" \;
          ./bin/prepare-rom.sh "$RUNNER_TEMP/sf2-lockstep-rom/rom.zip"
          cp allroms.bin "$RUNNER_TEMP/sf2-lockstep-rom/allroms.bin"
          cp sf2gfx.bin "$RUNNER_TEMP/sf2-lockstep-rom/sf2gfx.bin"
          cp sf2_09.bin "$RUNNER_TEMP/sf2-lockstep-rom/sf2_09.bin"
          cp sf2_18.bin "$RUNNER_TEMP/sf2-lockstep-rom/sf2_18.bin"
          cp sf2_19.bin "$RUNNER_TEMP/sf2-lockstep-rom/sf2_19.bin"
          chmod -R a-w "$RUNNER_TEMP/sf2-lockstep-rom"
      - name: Validate resolver work
        run: |
          set -euo pipefail
          bash scripts/validate_test_oracle_integrity.sh
          make clean && make -j2
          make clean && make SANITIZE=1 -j2
          make clean && make -j2
          make semantic-test
          bash scripts/validate_golden_traces.sh
      - name: Real MAME lockstep validation
        uses: ./.github/actions/mame-lockstep
        with:
          rom-root: ${{ runner.temp }}/sf2-lockstep-rom
          port-executable: ./glutBasics
          mame-bin: mame
          mame-set: sf2ua
          deep-trace: "false"
      - name: Commit validated resolution
        run: |
          set -euo pipefail
          git config user.name sf2-resolver-agent
          git config user.email sf2-resolver-agent@users.noreply.github.com
          git fetch origin main
          git rebase origin/main
          find . -type f -name "*.d" -delete
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "agent: resolve evidence-backed SF2 divergence"
          git push origin HEAD:main
      - name: Close resolved issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ inputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --comment "Validated resolution committed to main; issue closed by Agent 3."
