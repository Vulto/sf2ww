name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keep a single active validation run for this workflow. A newer push supersedes
# an older in-progress run instead of accumulating redundant executions.
concurrency:
  group: sf2-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Validate executable
        run: test -x build/glutBasics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
      LDFLAGS: "-fsanitize=address,undefined"
      ASAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug -DBUILD_FBTESTS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
      - name: Run headless game smoke test
        run: |
          truncate -s 1048576 allroms.bin
          truncate -s 2097152 sf2gfx.bin
          set +e
          SF2_STATE_LOG=smoke_state.csv timeout 15s xvfb-run -a ./build/glutBasics </dev/null
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          frames=$(( $(wc -l < smoke_state.csv) - 1 ))
          if [ "$frames" -lt 300 ]; then
            echo "SMOKE_FRAME_PROGRESS_FAILURE: expected at least 300 state frames, got $frames"
            exit 1
          fi

  smoke-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MAME
        run: |
          sudo apt-get update
          sudo apt-get install -y mame xvfb
          mame -version
          mame -listfull sf2ua | grep -q '^sf2ua '
      - name: Validate state comparator
        run: |
          printf '%s\n' 'frame,game_mode,game_tick,stage' '1,2,3,4' '2,2,4,4' > expected.csv
          cp expected.csv actual.csv
          bash scripts/compare_state_csv.sh expected.csv actual.csv
      - name: Report MAME fixture status
        run: |
          if [ -z "${SF2_MAME_ROM_ROOT:-}" ]; then
            echo "MAME_COMPARISON_BLOCKED: no private ROM fixture is mounted on this runner."
          else
            echo "MAME_COMPARISON_READY: private ROM fixture root is present."
          fi

  full-mame-regression:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MAME
        run: |
          sudo apt-get update
          sudo apt-get install -y mame freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
          mame -version
          mame -listfull sf2ua | grep -q '^sf2ua '
      - name: Check private ROM fixture
        id: fixture
        run: |
          if [ -z "${SF2_MAME_ROM_ROOT:-}" ] || [ ! -d "${SF2_MAME_ROM_ROOT}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "MAME regression blocked: private ROM fixture is not mounted."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install port dependencies
        if: steps.fixture.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure and build port
        if: steps.fixture.outputs.available == 'true'
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build && cmake --build build --parallel
      - name: Run MAME + native port lockstep
        if: steps.fixture.outputs.available == 'true'
        uses: ./.github/actions/mame-lockstep
        with:
          rom-root: ${{ env.SF2_MAME_ROM_ROOT }}
          port-executable: build/glutBasics
          mame-bin: mame
          mame-set: sf2ua
