name: Build

on:
  push:
    branches:
      - main
      - "graphics/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel
