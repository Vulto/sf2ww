name: Build

on:
  push:
    branches:
      - main
      - "graphics/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel

      - name: Run smoke tests
        run: |
          timeout 30s ./build/glutBasics </dev/null || test $? -eq 124

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
      LDFLAGS: "-fsanitize=address,undefined"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run smoke test
        run: |
          timeout 30s ./build/glutBasics </dev/null || test $? -eq 124
