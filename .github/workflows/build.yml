name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keep a single active validation run for this workflow. A newer push supersedes
# an older in-progress run instead of accumulating redundant executions.
concurrency:
  group: sf2-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Validate executable
        run: test -x build/glutBasics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug -DBUILD_FBTESTS=ON -DENABLE_SANITIZERS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
      - name: Run sanitizer unit tests only
        run: ctest --test-dir build --output-on-failure

  deterministic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run deterministic tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate golden traces
        run: bash scripts/validate_golden_traces.sh
