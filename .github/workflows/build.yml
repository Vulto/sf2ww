name: Build

on:
  push:
    branches:
      - main
      - "graphics/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel


  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev
      - name: Configure ASan/UBSan
        run: |
          cmake \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -S . -B build-asan
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Upload ASan runtime
        uses: actions/upload-artifact@v4
        with:
          name: crashfix-001-asan
          path: build-asan/glutBasics
          if-no-files-found: error
          retention-days: 1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure
