name: Build

on:
  push:
    branches:
      - main
      - "graphics/**"
      - "ci/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel

      - name: Validate executable
        run: test -x build/glutBasics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
      LDFLAGS: "-fsanitize=address,undefined"
      ASAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug -DBUILD_FBTESTS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
      - name: Run headless game smoke test
        run: |
          truncate -s 1048576 allroms.bin
          truncate -s 2097152 sf2gfx.bin
          set +e
          timeout 15s xvfb-run -a ./build/glutBasics </dev/null
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
