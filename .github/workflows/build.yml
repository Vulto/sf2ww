name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sf2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libsdl2-dev xvfb
          gcc --version
          make --version

      - name: Validate private ROM authentication contract
        run: |
          set -euo pipefail
          grep -F 'repository: Vulto/sf2wwrom' .github/workflows/autonomous-port.yml
          grep -F 'SF2WWROM_TOKEN' .github/workflows/autonomous-port.yml
          grep -F 'SF2_ROM_REPO_TOKEN' .github/workflows/autonomous-port.yml
          grep -F 'GITHUB_TOKEN' .github/workflows/autonomous-port.yml
          grep -F 'repository: Vulto/sf2wwrom' .github/workflows/oracle-guardian.yml
          grep -F 'secrets.SF2WWROM_TOKEN || secrets.SF2_ROM_REPO_TOKEN' .github/workflows/oracle-guardian.yml
          grep -F 'repository: Vulto/sf2wwrom' .github/workflows/private-rom-lockstep.yml
          grep -F 'secrets.SF2WWROM_TOKEN || secrets.SF2_ROM_REPO_TOKEN || github.token' .github/workflows/private-rom-lockstep.yml
          grep -F 'scripts/mame_sound_probe.lua' .github/actions/mame-lockstep/action.yml
          grep -F 'compare_sound_events.py mame_sound_events.csv native_audio_events.csv' .github/actions/mame-lockstep/action.yml

      - name: Build
        run: |
          set -o pipefail
          make clean
          make -j2 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-diagnostics-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate executable
        run: |
          test -x ./glutBasics
          file ./glutBasics

      - name: Native smoke test
        run: |
          set -euo pipefail
          truncate -s 1048576 allroms.bin
          truncate -s 6291456 sf2gfx.bin
          truncate -s 32768 sf2_09.bin
          truncate -s 262144 sf2_18.bin
          truncate -s 262144 sf2_19.bin
          set +e
          SF2_STATE_LOG=agent_smoke.csv SF2_TIMING_LOG=agent_timing.csv timeout 15s xvfb-run -a ./glutBasics </dev/null
          status=$?
          set -e
          test "$status" -eq 124
          test -s agent_smoke.csv
          test -s agent_timing.csv
          awk -F, 'NR > 1 { n++ } END { if (n < 300) exit 1 }' agent_smoke.csv
          rm -f agent_smoke.csv agent_timing.csv allroms.bin sf2gfx.bin sf2_09.bin sf2_18.bin sf2_19.bin

      - name: Validate comparator timing
        run: |
          bash scripts/test_compare_state_csv.sh
          bash tests/test_compare_semantic_frames.sh
          bash tests/test_compare_sound_events.sh

      - name: Validate golden traces
        run: bash scripts/validate_golden_traces.sh

  sanitizers:
    name: Sanitizers
    needs: build
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libsdl2-dev xvfb

      - name: Build sanitized executable
        run: |
          make clean
          make SANITIZE=1 -j2

      - name: Sanitized smoke test
        run: |
          truncate -s 1048576 allroms.bin
          truncate -s 6291456 sf2gfx.bin
          truncate -s 32768 sf2_09.bin
          truncate -s 262144 sf2_18.bin
          truncate -s 262144 sf2_19.bin
          set +e
          timeout 8s xvfb-run -a ./glutBasics </dev/null
          status=$?
          set -e
          test "$status" -eq 124
          rm -f allroms.bin sf2gfx.bin sf2_09.bin sf2_18.bin sf2_19.bin
