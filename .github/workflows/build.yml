name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: sf2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             freeglut3-dev             libglu1-mesa-dev             libgl1-mesa-dev             libcmocka-dev             xvfb
          gcc --version
          cmake --version

      - name: Configure
        env:
          CC: gcc
        run: |
          rm -rf build
          cmake             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DBUILD_FBTESTS=ON             -S .             -B build

      - name: Build executable
        run: cmake --build build --target glutBasics test-redhammer --parallel 2 --verbose

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate executable
        run: |
          test -x build/glutBasics
          file build/glutBasics

      - name: Native smoke test
        run: |
          set -euo pipefail
          set +e
          SF2_STATE_LOG=agent_smoke.csv timeout 15s xvfb-run -a ./build/glutBasics </dev/null
          status=$?
          set -e
          test "$status" -eq 124
          test -s agent_smoke.csv
          frames=$(awk -F, 'NR > 1 { n++ } END { print n + 0 }' agent_smoke.csv)
          test "$frames" -ge 300
          rm -f agent_smoke.csv

      - name: Validate golden traces
        run: bash scripts/validate_golden_traces.sh

  sanitizers:
    name: Sanitizers
    needs: build
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             freeglut3-dev             libglu1-mesa-dev             libgl1-mesa-dev             libcmocka-dev

      - name: Configure sanitized build
        env:
          CC: gcc
        run: |
          rm -rf build
          cmake             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_FBTESTS=ON             -DENABLE_SANITIZERS=ON             -S .             -B build

      - name: Build sanitized executable
        run: cmake --build build --target glutBasics test-redhammer --parallel 2 --verbose

      - name: Run sanitized tests
        run: ctest --test-dir build --output-on-failure
