name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Keep a single active validation run for this workflow. A newer push supersedes
# an older in-progress run instead of accumulating redundant executions.
concurrency:
  group: sf2-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Validate executable
        run: test -x build/glutBasics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: "abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug -DBUILD_FBTESTS=ON -DENABLE_SANITIZERS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
      - name: Run sanitizer unit tests only
        run: ctest --test-dir build --output-on-failure

  deterministic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev
      - name: Configure
        run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Run deterministic tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate golden traces
        run: bash scripts/validate_golden_traces.sh
  full-mame-regression:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MAME and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mame freeglut3-dev libglu1-mesa-dev libgl1-mesa-dev libcmocka-dev xvfb unzip curl perl
          mame -version
          mame -listfull sf2ua | grep -q '^sf2ua '
      - name: Materialize original ROM fixture
        env:
          SF2_MAME_ROM_B64: ${{ secrets.SF2_MAME_ROM_B64 }}
          SF2_MAME_ROM_SHA256: ${{ secrets.SF2_MAME_ROM_SHA256 }}
        run: |
          set -euo pipefail
          command -v mame
          command -v unzip
          command -v perl
          command -v xvfb-run
          mame -version
          mame -listfull sf2ua | grep -q '^sf2ua '
          test -n "$SF2_MAME_ROM_B64"
          rm -rf .private-mame
          mkdir -p .private-mame
          printf '%s' "$SF2_MAME_ROM_B64" | base64 -d > .private-mame/sf2ua.zip
          test -s .private-mame/sf2ua.zip
          if [ -n "$SF2_MAME_ROM_SHA256" ]; then
            echo "$SF2_MAME_ROM_SHA256  .private-mame/sf2ua.zip" | sha256sum -c -
          fi
          bash scripts/validate_sf2ua_fixture.sh .private-mame/sf2ua.zip
          bash scripts/prepare_mame_fixture.sh .private-mame .private-mame/sf2ua.zip
      - name: Build native port
        run: |
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_FBTESTS=ON -S . -B build
          cmake --build build --parallel
      - name: Run real native game with real ROM
        run: |
          set +e
          SF2_STATE_LOG=native_real_rom.csv timeout 30s xvfb-run -a ./build/glutBasics </dev/null
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "NATIVE_REAL_ROM_RUN_FAILED: exit status $status"
            exit "$status"
          fi
          frames=$(( $(wc -l < native_real_rom.csv) - 1 ))
          test "$frames" -ge 600
      - name: Run real MAME with real ROM
        run: |
          set +e
          timeout 30s xvfb-run -a mame sf2ua -rompath .private-mame -autoboot_delay 0 -skip_gameinfo -sound none -video opengl </dev/null
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "MAME_REAL_ROM_RUN_FAILED: exit status $status"
            exit "$status"
          fi