name: MAME lockstep
description: Run the private MAME state/execution probe and native port probes, then compare numeric arcade-time state.
inputs:
  deep-trace:
    description: "Run exhaustive reverse-engineering observation of the full attract cycle"
    required: false
    default: "false"
  rom-root:
    description: Private fixture root containing roms/, allroms.bin and sf2gfx.bin.
    required: true
  port-executable:
    description: Native port executable path.
    required: false
    default: ./glutBasics
  mame-bin:
    description: MAME executable.
    required: false
    default: mame
  mame-set:
    description: MAME ROM set name.
    required: false
    default: sf2ua
runs:
  using: composite
  steps:
    - name: Validate private fixture
      shell: bash
      env:
        ROM_ROOT: ${{ inputs.rom-root }}
      run: |
        set -euo pipefail
        test -d "$ROM_ROOT/roms/sf2ua"
        test -n "$(find "$ROM_ROOT/roms/sf2ua" -type f -print -quit)"
        test -f "$ROM_ROOT/allroms.bin"
        test -f "$ROM_ROOT/sf2gfx.bin"

    - name: Install Python test dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y python3-pil

    - name: Run MAME state and execution probe
      shell: bash
      env:
        SF2_MAME_ROMPATH: ${{ inputs.rom-root }}/roms
        MAME_BIN: ${{ inputs.mame-bin }}
        SF2_MAME_SET: ${{ inputs.mame-set }}
      run: |
        set -euo pipefail
        rm -f mame_state.csv mame_exec_numeric.csv reverse_sound_commands.csv native_audio_events.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_state_dump.lua" xvfb-run -a bash scripts/run_mame_state.sh
        test -s mame_state.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_exec_numeric.lua" xvfb-run -a bash scripts/run_mame_state.sh
        test -s mame_exec_numeric.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_exec_input.lua" xvfb-run -a bash scripts/run_mame_state.sh
        test -s mame_exec_input.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_seed_probe.lua" xvfb-run -a bash scripts/run_mame_state.sh
        test -s mame_seed_probe.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_demo_probe.lua" xvfb-run -a bash scripts/run_mame_state.sh
        test -s mame_demo_probe.csv
        cat mame_demo_probe.csv | head -5
        cat mame_demo_probe.csv | tail -20
        head -20 mame_seed_probe.csv

    - name: Deep reverse-engineering trace
      if: inputs.deep-trace == 'true'
      shell: bash
      env:
        SF2_MAME_ROMPATH: ${{ inputs.rom-root }}/roms
        MAME_BIN: ${{ inputs.mame-bin }}
        SF2_MAME_SET: ${{ inputs.mame-set }}
        SF2_REVERSE_MAX_FRAMES: 7200
        SF2_REVERSE_TRACE_INSTRUCTIONS: 0
      run: |
        set -euo pipefail
        rm -f reverse_frames.csv reverse_memory_reads.csv reverse_memory_writes.csv reverse_ram_changes.csv reverse_memory_map.csv reverse_manifest.csv reverse_registers.csv reverse_audiocpu_reads.csv reverse_audiocpu_writes.csv reverse_sound_commands.csv reverse_68000.tr reverse_z80.tr
        xvfb-run -a bash scripts/run_mame_reverse_trace.sh
        test -s reverse_sound_commands.csv
        test -s reverse_audiocpu_reads.csv
        test -s reverse_audiocpu_writes.csv
    - name: Run native port probes
      shell: bash
      env:
        ROM_ROOT: ${{ inputs.rom-root }}
        PORT_EXECUTABLE: ${{ inputs.port-executable }}
      run: |
        set -euo pipefail
        cp "$ROM_ROOT/allroms.bin" allroms.bin
        cp "$ROM_ROOT/sf2gfx.bin" sf2gfx.bin
        set +e
        SF2_MAX_FRAMES=900 SF2_STATE_LOG=port_state.csv SF2_TIMING_LOG=port_timing.csv timeout 30s xvfb-run -a "$PORT_EXECUTABLE" </dev/null
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        test -s port_state.csv
        test -s port_timing.csv
        SF2_INPUT_TEST=1 SF2_MAX_FRAMES=900 SF2_STATE_LOG=port_state_input.csv SF2_TIMING_LOG=port_timing_input.csv timeout 30s xvfb-run -a "$PORT_EXECUTABLE" </dev/null
        status=$?
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        test -s port_state_input.csv
        test -s port_timing_input.csv
        SF2_AUDIO_EVENT_LOG=1 SF2_MAX_FRAMES=12000 timeout 230s xvfb-run -a "$PORT_EXECUTABLE" </dev/null >/tmp/sf2-native-audio.log 2>&1
        test -s native_audio_events.csv

    - name: "Visual lockstep: MAME attract mode versus native framebuffer"
      shell: bash
      env:
        SF2_MAME_ROMPATH: ${{ inputs.rom-root }}/roms
        MAME_BIN: ${{ inputs.mame-bin }}
        SF2_MAME_SET: ${{ inputs.mame-set }}
        SF2_VISUAL_EVERY: 60
        SF2_VISUAL_MAX_FRAMES: 12000
      run: |
        set -euo pipefail
        rm -rf mame_visual native_visual
        mkdir -p mame_visual native_visual
        rm -f mame_exec_attract.csv port_state_attract.csv port_timing_attract.csv
        SF2_NUMERIC_MAX_FRAMES=12000 SF2_MAME_STATE_SCRIPT="scripts/mame_exec_numeric.lua" \
          xvfb-run -a bash scripts/run_mame_state.sh
        mv mame_exec_numeric.csv mame_exec_attract.csv
        SF2_MAME_STATE_SCRIPT="scripts/mame_visual_dump.lua" SF2_VISUAL_DIR="$PWD/mame_visual" SF2_VISUAL_EVERY=60 SF2_VISUAL_MAX_FRAMES=12000 \
          xvfb-run -a bash scripts/run_mame_state.sh \
          >/tmp/sf2-mame-visual.log 2>&1
        test -n "$(find mame_visual -name 'frame_*.png' -print -quit)"
        echo "MAME_ATTRACT_MODE_TRANSITIONS"
        cat visual_modes.csv
        set +e
        SF2_MAX_FRAMES=12000 SF2_STATE_LOG=port_state_attract.csv SF2_TIMING_LOG=port_timing_attract.csv SF2_VISUAL_DIR="$PWD/native_visual" SF2_VISUAL_EVERY=60 SF2_VISUAL_MAX_FRAMES=12000 \
          timeout 230s xvfb-run -a ./glutBasics \
          </dev/null >/tmp/sf2-native-visual.log 2>&1
        native_status=$?
        set -e
        cat /tmp/sf2-native-visual.log | tail -100
        if [ "$native_status" -ne 0 ]; then
          exit "$native_status"
        fi
        test -n "$(find native_visual -name 'frame_*.ppm' -print -quit)"
        echo "NATIVE_OBJECTS_AT_1380"
        cat native_visual_objects.txt
        python3 scripts/validate_visual_anchors.py --mame-dir mame_visual --native-dir native_visual
        bash scripts/compare_mame_port_numeric.sh mame_exec_attract.csv port_state_attract.csv
        python3 scripts/compare_visual_frames.py \
          --mame-dir mame_visual \
          --native-dir native_visual \
          --out visual_comparison.csv

    - name: Compare numeric state and arcade timing
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/compare_timing_csv.sh mame_state.csv port_state.csv
        bash scripts/compare_mame_port_numeric.sh mame_exec_numeric.csv port_state.csv
        bash scripts/validate_host_timing.sh port_timing.csv
        bash scripts/compare_mame_port_numeric.sh mame_exec_input.csv port_state_input.csv
        bash scripts/validate_host_timing.sh port_timing_input.csv

    - name: Upload comparison evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mame-lockstep-evidence-${{ github.run_id }}
        path: |
          mame_state.csv
          mame_exec_numeric.csv
          port_state.csv
          port_timing.csv
          visual_comparison.csv
          mame_exec_attract.csv
          reverse_audiocpu_reads.csv
          reverse_sound_commands.csv
          reverse_frames.csv
          reverse_memory_reads.csv
          reverse_memory_writes.csv
          reverse_ram_changes.csv
          reverse_memory_map.csv
          reverse_manifest.csv
          reverse_registers.csv
          reverse_audiocpu_writes.csv
          reverse_68000.tr
          reverse_z80.tr
          native_audio_events.csv
          port_state_attract.csv
          port_timing_attract.csv
          visual_modes.csv
          mame_visual/
          native_visual/
          native_visual_objects.txt
        if-no-files-found: ignore
        retention-days: 7
